services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - chromadb
      - ollama
      - mongodb
      - mcp-atlassian
    restart: unless-stopped

  mcp-atlassian:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    environment:
      - JIRA_URL=${JIRA_BASE_URL}
      - JIRA_USERNAME=${JIRA_USER_EMAIL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
    ports:
      - "9000:9000"
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:0.5.15
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU yok — CPU-only çalışır, ek config gerekmez
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1.0.2
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  chroma_data:
  ollama_data:
  mongo_data:
